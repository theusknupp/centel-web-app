
<app-navbar></app-navbar>

<main class="container-cadastro" id="cadastro">

    <section class="glass-card-grande">
        <header *temPermissao="[ Permissoes.CLIENTE.CADASTRAR, Permissoes.CLIENTE.EDITAR ]; modo: 'algum'">
            <h1>Cadastro de Cliente</h1>
            <p>Preencha os dados para registrar um Cliente.</p>
        </header>

        <!--A função de Salvar o Cliente é chamada através do NgSubmit-->
        <form [formGroup]="clienteForm" (ngSubmit)="salvarCliente()" class="form-grid" *temPermissao="[ Permissoes.CLIENTE.CADASTRAR, Permissoes.CLIENTE.EDITAR ]; modo: 'algum'">


            <div class="form-section">
                <div class="input-full">
                    <label for="nome">Nome Completo / Razão Social</label>
                    <input id="nome" type="text" formControlName="nome"
                        [class.input-invalid]="campoInvalido('nome')">
                </div>

                <div class="input-half">
                    <label for="cpf_cnpj">CPF ou CNPJ</label>
                    <input id="cpf_cnpj" type="text" formControlName="cpf_cnpj"
                        (input)="onCpfCnpjInput($event)" (blur)="validarCpfCnpjOnBlur()"
                        [class.input-invalid]="campoInvalido('cpf_cnpj')">
                </div>

                <div class="input-half">
                    <label for="nrtel">Telefone</label>
                    <input id="nrtel" type="tel" formControlName="nrtel" inputmode="numeric"
                        placeholder="(00) 00000-0000" maxlength="15" autocomplete="tel"
                        (input)="onTelefoneInput($event)"
                        [class.input-invalid]="campoInvalido('nrtel')">
                </div>

                <div class="input-half">
                    <label for="email">E-mail</label>
                    <input id="email" type="email" formControlName="email"
                        placeholder="exemplo@gmail.com" autocomplete="email"
                        (blur)="onEmailBlur()"
                        [class.input-invalid]="campoInvalido('email')">
                </div>

                <div class="input-half">
                    <label for="tipo_pessoa">Tipo de Pessoa</label>
                    <select id="tipo_pessoa" formControlName="tipo_pessoa">
                        <option value="PF">Pessoa Física</option>
                        <option value="PJ">Pessoa Jurídica</option>
                    </select>
                </div>
            </div>

            <div class="form-section">
                <div class="input-half">
                    <label for="cep">CEP</label>
                    <input id="cep" type="text" formControlName="cep" inputmode="numeric"
                        placeholder="00000-000" maxlength="9" autocomplete="postal-code"
                        (input)="onCepInput($event)"
                        [class.input-invalid]="campoInvalido('cep')">
                </div>

                <div class="input-half">
                    <label for="logradouro">Logradouro</label>
                    <input id="logradouro" type="text" formControlName="logradouro">
                </div>

                <div class="input-quarter">
                    <label for="numero">Numero</label>
                    <input id="numero" type="text" formControlName="numero" inputmode="numeric"
                        (input)="onNumeroInput($event)"
                        [class.input-invalid]="campoInvalido('numero')">
                </div>

                <div class="input-half">
                    <label for="bairro">Bairro</label>
                    <input id="bairro" type="text" formControlName="bairro"
                        [class.input-invalid]="campoInvalido('bairro')">
                </div>

                <div class="input-half">
                    <label for="cidade">Cidade</label>
                    <input id="cidade" type="text" formControlName="cidade"
                        [class.input-invalid]="campoInvalido('cidade')">
                </div>

                <div class="input-quarter">
                    <label for="uf">UF</label>
                    <select id="uf" formControlName="uf"
                        [class.input-invalid]="campoInvalido('uf')">
                        <option value="" disabled>Selecione a UF</option>
                        @for (estado of ufsBrasil; track estado.sigla) {
                            <option [value]="estado.sigla">{{ estado.sigla }} — {{ estado.nome }}</option>
                        }
                    </select>
                </div>
            </div>


            <div class="form-actions">
                <button type="button" class="btn-cancelar" (click)="limparFormulario()"> Cancelar </button>

                <button type="submit" class="btn-salvar" [disabled]="clienteForm.invalid">
                    {{ editandoClienteId ? 'Atualizar Cadastro' : 'Finalizar Cadastro' }}
                </button>

            </div>
        </form>

    </section>
</main>
<!--Modal de Confirmação-->
<app-modal-confirmacao *ngIf="modalConfirmacao" [titulo]="tituloConfirmacao" [mensagem]="mensagemConfirmacao"
    textoBotaoConfirmar="{{ textoBotaoConfirmar }}" textoBotaoCancelar="{{ textoBotaoCancelar }}"
    (aoConfirmar)="acaoConfirmacao()" (aoCancelar)="fecharModalSemSalvar()">
</app-modal-confirmacao>

<!--Modal de Retorno-->
<app-modal-retorno *ngIf="modalRetorno" [titulo]="tituloRetorno" [mensagem]="mensagemRetorno"
    textoBotaoConfirmar="Entendido" (aoConfirmar)="fecharModalRetorno()">
</app-modal-retorno>
