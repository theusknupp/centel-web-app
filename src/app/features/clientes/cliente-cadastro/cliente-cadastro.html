<app-navbar></app-navbar>

<main class="container-cadastro" id="cadastro">

    <section class="glass-card-grande">
        <header>
            <h1>Cadastro de Cliente</h1>
            <p>Preencha os dados para registrar um Cliente.</p>
        </header>

        <!--A função de Salvar o Cliente é chamada através do NgSubmit-->
        <!--<form (ngSubmit)="salvarCliente()" class="form-grid">-->
        <form #form="ngForm" (ngSubmit)="form.valid && validarCpfCnpj(novoCliente.cpf_cnpj) && validarEmail(novoCliente.email) && salvarCliente()" class="form-grid">

            <div class="form-section">
                <div class="input-full">
                    <label for="">Nome Completo / Razão Social</label>
                    <input type="text" name="nome" [(ngModel)]="novoCliente.nome" required>
                </div>

                <div class="input-half">
                    <label>CPF ou CNPJ</label>
                    <input 
                        type="text" 
                        name="cpf_cnpj" 
                        [(ngModel)]="novoCliente.cpf_cnpj"
                        #cpf="ngModel"
                        required
                        (input)="onCpfCnpjInput()"
                        (keypress)="bloquearExcessoCpfCnpj($event)"
                        [class.invalido]="cpf.invalid && cpf.touched"
                    >

                    <small *ngIf="cpf.invalid && cpf.touched">
                        Campo obrigatório
                    </small>

                    <small *ngIf="cpf.touched && cpf.value && 
                        ((novoCliente.tipo_pessoa === 'PF' && cpf.value.length >= 14 && !validarCpfCnpj(cpf.value)) ||
                        (novoCliente.tipo_pessoa === 'PJ' && cpf.value.length >= 18 && !validarCpfCnpj(cpf.value)))">
                        {{ novoCliente.tipo_pessoa === 'PF' ? 'CPF inválido' : 'CNPJ inválido' }}
                    </small>


                </div>

                <div class="input-half">
                    <label for="">Telefone</label>
                    <input type="text" name="nrtel" [(ngModel)]="novoCliente.nrtel" placeholder="(XX) 9XXXX-XXXX" required (input)="onTelefoneInput()" (keypress)="bloquearExcessoTelefone($event)">
                </div>

                <div class="input-half">
                    <label>E-mail</label>
                    <input 
                        type="email"
                        name="email"
                        [(ngModel)]="novoCliente.email"
                        #email="ngModel"
                        required
                    >

                    <small *ngIf="email.invalid && email.touched">
                        Email obrigatório ou inválido
                    </small>

                    <small *ngIf="email.value && !validarEmail(email.value)">
                        Email deve conter domínio válido (ex: gmail.com)
                    </small>
                </div>


                <div class="input-half">
                    <label for="">Tipo de Pessoa</label>
                    <select name = "tipo_pessoa" [(ngModel)]="novoCliente.tipo_pessoa" (change)="novoCliente.cpf_cnpj = ''" required>
                        <option value="PF">Pessoa Física</option>
                        <option value="PJ">Pessoa Jurídica</option>
                    </select>
                </div>
            </div>

            <div class="form-section">
                <div class="input-half">
                    <label for="">CEP</label>
                    <input type="text" name="cep" [(ngModel)]="novoCliente.cep">
                </div>

                <div class="input-half">
                    <label for="">Logradouro</label>
                    <input type="text" name="logradouro" [(ngModel)]="novoCliente.logradouro">
                </div>

                <div class="input-quarter">
                    <label for="">Numero</label>
                    <input type="text" name="numero" [(ngModel)]="novoCliente.numero" required>
                </div>

                <div class="input-half">
                    <label for="">Bairro</label>
                    <input type="text" name="bairro" [(ngModel)]="novoCliente.bairro" required>
                </div>

                <div class="input-half">
                    <label for="">Cidade</label>
                    <input type="text" name="cidade" [(ngModel)]="novoCliente.cidade" required>
                </div>

                <div class="input-quarter">
                    <label for="">UF</label>
                    <input type="text" name="uf" [(ngModel)]="novoCliente.uf" required>
                </div>
            </div>
    

            <div class="form-actions">
                <!--<button type="button" class="btn-cancelar" onclick="limparFormulario()"> Cancelar </button>-->
                <button type="button" class="btn-cancelar" (click)="limparFormulario()"> Cancelar </button>
                <button type="submit" class="btn-salvar" [disabled]="!form.valid || !validarCpfCnpj(novoCliente.cpf_cnpj) || !validarEmail(novoCliente.email)"> Finalizar Cadastro</button>
            </div>
        </form>
    </section>
</main>

<!--Modal de Confirmação-->
<app-modal-confirmacao 
  *ngIf="modalConfirmacao"
  titulo="Confirmar Cadastro"
  mensagem="Tem a certeza que os dados do cliente foram preenchidos corretamente e deseja prosseguir com o registo?"
  textoBotaoConfirmar="Confirmar"
  textoBotaoCancelar="Cancelar"
  (aoConfirmar)="inserirCliente()"
  (aoCancelar)="fecharModalSemSalvar()">
</app-modal-confirmacao>

<!--Modal de Retorno-->
<app-modal-retorno
  *ngIf="modalRetorno"
  [titulo]="tituloRetorno"
  [mensagem]="mensagemRetorno"
  textoBotaoConfirmar="Entendido"
  (aoConfirmar)="fecharModalRetorno()">
</app-modal-retorno>
