<header class="glass-nav">
  <div class="logo" routerLink="/dashboard" style="cursor: pointer;" title="Ir para o Início">
    <span class="logo-highlight">CEN</span>TEL
  </div>
  
  <button class="menu-toggle" (click)="toggleMenu()">
    <span *ngIf="!menuAberto">☰</span>
    <span *ngIf="menuAberto">✕</span>
  </button>

 <nav [class.aberto]="menuAberto">
    <ul class="nav-links">
      
      <li
        *temPermissao="[ Permissoes.ORDEM_SERVICO.VISUALIZAR, Permissoes.ORDEM_SERVICO.CADASTRAR, Permissoes.ORDEM_SERVICO.EDITAR, Permissoes.ORDEM_SERVICO.EXCLUIR ]; modo: 'algum'"
        class="dropdown" routerLinkActive="active">
        <a style="cursor: pointer;">Ordens de Serviço ▾</a>
        <div class="dropdown-content">
          <a
            *temPermissao="[ Permissoes.ORDEM_SERVICO.CADASTRAR, Permissoes.ORDEM_SERVICO.EDITAR ]; modo: 'algum'"
            routerLink="/emissao-os" routerLinkActive="active"
            (click)="fecharMenu()">Emitir Nova OS</a>
          <a routerLink="/lista-os" routerLinkActive="active"
            *temPermissao="[ Permissoes.ORDEM_SERVICO.VISUALIZAR, Permissoes.ORDEM_SERVICO.CADASTRAR, Permissoes.ORDEM_SERVICO.EDITAR, Permissoes.ORDEM_SERVICO.EXCLUIR ]; modo: 'algum'"
            (click)="fecharMenu()">Listar Ordens</a>
        </div>
      </li>
      
      <li 
        *temPermissao="[ Permissoes.CLIENTE.VISUALIZAR, Permissoes.CLIENTE.CADASTRAR, Permissoes.CLIENTE.EDITAR, Permissoes.CLIENTE.EXCLUIR ]; modo: 'algum'"
        class="dropdown" routerLinkActive="active">
        <a style="cursor: pointer;">Clientes ▾</a>
        <div class="dropdown-content">
          <a 
            *temPermissao="[ Permissoes.CLIENTE.CADASTRAR, Permissoes.CLIENTE.EDITAR ]; modo: 'algum'"
            routerLink="/cadastro" routerLinkActive="active" 
            (click)="fecharMenu()">Cadastrar Cliente</a>
          <a 
            *temPermissao="[ Permissoes.CLIENTE.VISUALIZAR, Permissoes.CLIENTE.CADASTRAR, Permissoes.CLIENTE.EDITAR, Permissoes.CLIENTE.EXCLUIR ]; modo: 'algum'"
            routerLink="/lista-clientes" routerLinkActive="active" 
            (click)="fecharMenu()">Listar Clientes</a>
        </div>
      </li>
      
      <li *temPermissao="[ Permissoes.ESTOQUE.VISUALIZAR ]; modo: 'algum'">
        <a routerLink="/estoque" routerLinkActive="active" (click)="fecharMenu()">Estoque</a>
      </li>
      <li *temPermissao="[ Permissoes.RELATORIO.VISUALIZAR ]; modo: 'algum'">
        <a routerLink="/relatorio" routerLinkActive="active" (click)="fecharMenu()">Relatório</a>
      </li>
      
    </ul>
  </nav>
  
  <div class="user-profile">
      <button class="btn-logout" (click)="logout()" title="Sair do Sistema">
      Sair
     </button>

     <div style="position: relative;">
       <div class="avatar" (click)="toggleAdminMenu()" title="Configurações e Perfil"></div>

       <ng-container *ngIf="menuAdminAberto">
         <div class="admin-dropdown" *temPermissao="[Permissoes.RELATORIO.VISUALIZAR]">
           <a routerLink="/admin/usuarios" (click)="fecharMenusCompletos()">
             Gestão de Usuários
           </a>
         </div>
       </ng-container>
     </div>

  </div>
</header>
